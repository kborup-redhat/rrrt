name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/tutorial/**'
      - '.github/workflows/docs.yaml'

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install HonKit
        run: |
          npm install -g honkit
          cd docs/tutorial
          npm init -y
          npm install gitbook-plugin-mermaid-hybrid

      - name: Build docs
        run: |
          cd docs/tutorial
          honkit build . _book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/tutorial/_book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
